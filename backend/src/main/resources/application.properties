spring.application.name=UAVServer
server.port=8081

# Database Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/uavserver?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:yln27878}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=${JWT_SECRET:UAVServerSecretKeyForJWTTokenGenerationAndValidation2024}
jwt.expiration=86400000

# File Storage Configuration
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.flight-plan-dir=${FLIGHT_PLAN_DIR:./flight-plans}
file.report-dir=${REPORT_DIR:./reports}

# Logging Configuration
logging.level.com.uav.uavserver=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
